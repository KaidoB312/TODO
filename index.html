<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Todo List</h1>
      <p class="subtitle">Stay organized, get things done.</p>
    </header>

    <div class="add-section">
      <input
        type="text"
        id="todoInput"
        class="todo-input"
        placeholder="What needs to be done?"
        maxlength="200"
      />
      <button id="addBtn" class="btn btn-add">Add</button>
    </div>

    <div class="toolbar">
      <span id="counter" class="counter">0 items</span>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clearCompleted" class="btn btn-clear">Clear Completed</button>
    </div>

    <ul id="todoList" class="todo-list"></ul>

    <footer class="footer">
      <p>Double-click an item to edit &bull; Press Enter to save</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
